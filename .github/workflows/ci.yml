name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a new push cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency security audit
        run: pnpm audit --audit-level low

      - name: Lint and format check
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests (node)
        run: pnpm test:node

      - name: Sync property tests (convex-test)
        run: pnpm test:convex

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Component tests (browser)
        run: pnpm test:browser

      - name: Production build
        env:
          VITE_CONVEX_URL: https://placeholder.convex.cloud
          VITE_CONVEX_SITE_URL: https://placeholder.convex.site
          VITE_SITE_URL: http://localhost:3000
        run: pnpm build

  # Full local-first journey against a throwaway anonymous Convex backend.
  # Separate job so its heavier, fiddlier setup can't gate the core checks.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start local S3-compatible object storage
        run: |
          # Moto replaces the retired MinIO images for the throwaway S3 backend.
          docker run --detach --rm --name librium-s3 \
            --publish 127.0.0.1:9000:5000 \
            motoserver/moto:5.2.4@sha256:120b1589c6df7e35d2092935f6ff724486bb2c4189d0e36ce795baba1400ffd2
          for i in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:9000/; then
              READY=1; break
            fi
            sleep 1
          done
          if [ -z "$READY" ]; then docker logs librium-s3; exit 1; fi
          docker exec librium-s3 python -c \
            'import boto3; boto3.client("s3", endpoint_url="http://127.0.0.1:5000", aws_access_key_id="librium-e2e", aws_secret_access_key="librium-e2e-secret", region_name="us-east-1").create_bucket(Bucket="librium-e2e")'

      - name: Start anonymous Convex backend and deploy functions
        env:
          CONVEX_AGENT_MODE: anonymous
        run: |
          # --typecheck disable: the `checks` job already runs tsc over the
          # whole project (convex/ included); re-checking here just re-resolves
          # tsconfig in a fresh env and flakes on the node `process` global.
          pnpm exec convex dev --typecheck disable > /tmp/convex.log 2>&1 &
          echo $! > /tmp/convex.pid
          # Wait for functions to finish pushing (env.local is written at
          # configure time, before the push completes — so gate on both).
          for i in $(seq 1 90); do
            if grep -qi "functions ready" /tmp/convex.log \
              && [ -f .env.local ] && grep -q VITE_CONVEX_URL .env.local; then
              READY=1; break
            fi
            sleep 2
          done
          if [ -z "$READY" ]; then
            echo 'Convex did not become ready'
            tail -200 /tmp/convex.log | sed -E 's/([A-Z_]*(KEY|SECRET|TOKEN)[A-Z_]*=).*/\1<redacted>/g'
            exit 1
          fi
          # auth-client needs the .site URL; derive it if convex didn't write it.
          if ! grep -q VITE_CONVEX_SITE_URL .env.local; then
            SITE=$(grep VITE_CONVEX_URL .env.local | cut -d= -f2- | sed 's/3210/3211/')
            echo "VITE_CONVEX_SITE_URL=$SITE" >> .env.local
          fi

      - name: Configure auth env on the deployment
        env:
          CONVEX_AGENT_MODE: anonymous
        run: |
          pnpm exec convex env set SITE_URL http://localhost:3000
          pnpm exec convex env set BETTER_AUTH_SECRET "$(openssl rand -base64 32)"
          pnpm exec convex env set R2_BUCKET librium-e2e
          pnpm exec convex env set R2_ENDPOINT http://127.0.0.1:9000
          pnpm exec convex env set R2_ACCESS_KEY_ID librium-e2e
          pnpm exec convex env set R2_SECRET_ACCESS_KEY librium-e2e-secret

      - name: Run e2e
        run: pnpm test:e2e

      - name: Stop Convex
        if: always()
        run: |
          kill "$(cat /tmp/convex.pid)" 2>/dev/null || true
          pkill -f 'convex' 2>/dev/null || true
          docker stop librium-s3 2>/dev/null || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
